{{- if .Values.serviceMonitor.enabled }}
{{/*
Needs the Prometheus Operator CRDs. On AKS you get them with Azure Managed
Prometheus (az aks update --enable-azure-monitor-metrics) or by installing
kube-prometheus-stack yourself.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lab-app.fullname" . }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "lab-app.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
