# Optional: one ApplicationSet instead of an Application per storage mode.
#
#   kubectl apply -f demo/argocd/applicationset.yaml
#
# Argo CD generates a child Application for each element in the list generator,
# so this stands up all three storage modes side by side in three namespaces -
# which is the fastest way to compare them:
#
#   kubectl -n demo-ephemeral get pods                  # no PVC at all
#   kubectl -n demo-shared    get deploy,pvc            # one PVC, many pods
#   kubectl -n demo-perpod    get statefulset,pvc       # one PVC per pod
#
# Use EITHER this file OR the application-*.yaml files - not both, or two
# controllers end up managing the same releases.
#
# Be aware of the cost before you apply it: the shared and perPod children
# provision real Azure resources, and with minReplicas 2 the perPod child
# creates two managed disks immediately.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - mode: ephemeral
            namespace: demo-ephemeral
          - mode: shared
            namespace: demo-shared
          - mode: perpod
            namespace: demo-perpod
  template:
    metadata:
      name: 'demo-app-{{ .mode }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/websolut/argocd-example-apps.git
        targetRevision: master
        path: demo
        helm:
          releaseName: demo-app
          valueFiles:
            - values.yaml
            - 'values-{{ .mode }}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        # Every generated Application gets the same policy. If you want the
        # stateful one gated behind a manual sync - which is the sensible
        # default for anything holding data - use the two application-*.yaml
        # files instead, or add a templatePatch here.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/replicas
  # Do not delete generated Applications when an element disappears from the
  # list - you remove them yourself. For a chart that owns PersistentVolumes
  # this is the safer default: an accidental edit to the generator should not
  # cascade into deleted claims. Drop it to get full lifecycle management.
  syncPolicy:
    preserveResourcesOnDeletion: true
