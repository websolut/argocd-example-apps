apiVersion: v1
kind: Service
metadata:
  name: guestbook-ui
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: guestbook-ui

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guestbook
  namespace: default
spec:
  hostnames:
  - guestbook.websolutsg.co.uk
  parentRefs:
    - name: platform-gateway
  rules:
    - backendRefs:
        - name: guestbook-ui
          port: 80
