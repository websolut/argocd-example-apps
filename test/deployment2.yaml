apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-local
spec:
  # Must stay at 1 while test-pvc-disk (ReadWriteOnce) is mounted. An Azure
  # Disk attaches to exactly one node, so a second replica on another node
  # hangs forever with a Multi-Attach error.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate, for the same reason. A rolling update would
    # deadlock: the new pod cannot attach the disk while the old pod still
    # holds it, so the new pod sits in ContainerCreating and the old one never
    # goes away. Recreate stops the old pod first, then starts the new one -
    # at the cost of a gap with no pod running.
    type: Recreate
  # The selector is immutable once created. Never put anything volatile
  # (a version, a checksum) in here.
  selector:
    matchLabels:
      app: test-app-local
  template:
    metadata:
      labels:
        # Must match the selector above, or the Deployment is rejected.
        app: test-app-local
    spec:
      containers:
        - name: nginx-local
          image: crwebsolutdeveusc9b64b.azurecr.io/nginx:latest

