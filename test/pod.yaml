apiVersion: v1
kind: Pod
metadata:
  name: test-pod

spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      volumeMounts:
        # nginx serves whatever is in this directory, so the Azure Files share
        # becomes the web root. Mounting here HIDES the image default
        # index.html, so an empty share returns 403 until you put a file in it.
        - name: data
          mountPath: /usr/share/nginx/html
        - name: disk
          mountPath: /mnt/disk
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc
    - name: disk
      persistentVolumeClaim:
        claimName: test-pvc-disk
