apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  annotations:
    # A Pod is almost entirely immutable: only image, activeDeadlineSeconds,
    # tolerations and terminationGracePeriodSeconds can be patched. Adding a
    # volume is therefore rejected by the API server, and Argo CD - which
    # patches by default - reports SyncFailed.
    #
    # Replace=true makes Argo CD delete and recreate this object instead of
    # patching it. Fine for a single test Pod. For anything long-lived use a
    # Deployment: it takes patches normally, because the ReplicaSet replaces
    # the pods for you.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      volumeMounts:
        # nginx serves whatever is in this directory, so the Azure Files share
        # becomes the web root. Mounting here HIDES the image default
        # index.html, so an empty share returns 403 until you put a file in it.
        - name: data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc
